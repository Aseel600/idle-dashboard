<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%2300c6ff' stroke-width='2'/%3E%3Cline x1='12' y1='12' x2='12' y2='6' stroke='%2300c6ff' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='12' y1='12' x2='16' y2='14' stroke='%2300c6ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Ambient OS — Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
      background: radial-gradient(circle at top, rgba(0, 198, 255, 0.06), transparent 45%), #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card { max-width: 420px; }
    .clock-icon { width: 64px; height: 64px; margin: 0 auto 20px; opacity: 0.9; }
    .code { font-size: 2.6rem; font-weight: bold; letter-spacing: 2px; color: #00c6ff; margin-bottom: 6px; }
    h1 { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
    p { font-size: 0.9rem; color: #888888; line-height: 1.6; }
    .home-btn {
      display: inline-block; margin-top: 22px; padding: 10px 26px; border-radius: 30px;
      background: #00c6ff; color: #050505; text-decoration: none; font-weight: bold; font-size: 0.85rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .home-btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .ar { direction: rtl; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="#00c6ff" stroke-width="1.5">
      <circle cx="12" cy="12" r="9" />
      <line x1="12" y1="12" x2="12" y2="6" stroke-linecap="round" />
      <line x1="12" y1="12" x2="16" y2="14" stroke-linecap="round" />
    </svg>
    <div class="code">404</div>
    <h1>This page drifted out of orbit</h1>
    <p>The page you're looking for doesn't exist — but your dashboard is right where you left it.</p>
    <a class="home-btn" href="/">Back to Dashboard</a>
    <div class="ar">
      <h1>هذه الصفحة غير موجودة</h1>
      <p>الصفحة التي تبحث عنها غير موجودة — لكن لوحة التحكم الخاصة بك في مكانها كما تركتها.</p>
    </div>
  </div>
</body>
</html>
