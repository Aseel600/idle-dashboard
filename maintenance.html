<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%2300c6ff' stroke-width='2'/%3E%3Cline x1='12' y1='12' x2='12' y2='6' stroke='%2300c6ff' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='12' y1='12' x2='16' y2='14' stroke='%2300c6ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>Ambient OS — Under Maintenance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
      background: radial-gradient(circle at top, rgba(0, 198, 255, 0.06), transparent 45%), #050505;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card { max-width: 420px; }
    .clock-icon { width: 64px; height: 64px; margin: 0 auto 24px; opacity: 0.9; animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    h1 { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }
    p { font-size: 0.9rem; color: #888888; line-height: 1.6; margin-bottom: 6px; }
    .ar { direction: rtl; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 22px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #00c6ff; opacity: 0.3; animation: blink 1.4s ease-in-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="card">
    <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="#00c6ff" stroke-width="1.5">
      <circle cx="12" cy="12" r="9" />
      <line x1="12" y1="12" x2="12" y2="6" stroke-linecap="round" />
      <line x1="12" y1="12" x2="16" y2="14" stroke-linecap="round" />
    </svg>
    <h1>Ambient OS is getting a tune-up</h1>
    <p>We're making some changes behind the scenes. Everything will be back shortly — your data on this device isn't affected.</p>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="ar">
      <h1>لوحة Ambient OS قيد الصيانة</h1>
      <p>نقوم ببعض التعديلات في الخلفية. سيعود كل شيء قريبًا — بياناتك على هذا الجهاز لم تتأثر.</p>
    </div>
  </div>
</body>
</html>
